name: Check data set

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-data-set-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      datasets: ${{ steps.datasets.outputs.datasets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: List the changed data sets
        id: datasets
        run: echo "datasets=$(python3 .github/scripts/check_pr.py --base origin/${{ github.base_ref }} --datasets-json)" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check the changed files
        run: python .github/scripts/check_pr.py --base origin/${{ github.base_ref }}
      - name: Check that the notebook index is up to date
        # A new data set is listed by the maintainer, so the index is checked only when a
        # pull request changes a README or docs/, or a notebook that is already listed.
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          listed=""
          for f in $(echo "$changed" | grep '\.ipynb$'); do
            name=$(basename "$(dirname "$f")")
            if grep -qF "[$name]" docs/notebook-index.md; then listed="$listed $f"; fi
          done
          if echo "$changed" | grep -qE '(^|/)README\.md$|^docs/' || [ -n "$listed" ]; then
            python docs/make_notebook_index.py --check
          else
            echo "::notice::No listing change and no listed notebook changed; the maintainer updates the notebook index when listing a new data set."
          fi
      - name: Check that the suggested-articles page is up to date
        run: python docs/make_candidates_md.py --check

  datasets:
    needs: changes
    if: needs.changes.outputs.datasets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.changes.outputs.datasets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the requirements
        run: pip install -r requirements.txt
      - name: Run the notebook and scripts
        run: python .github/scripts/run_dataset.py "${{ matrix.directory }}"
