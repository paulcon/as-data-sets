description: |-
  H2/O2 mechanism of Li, Zhao, Kazakov and Dryer, "An updated comprehensive kinetic model
  of hydrogen combustion", Int. J. Chem. Kinet. 36 (2004) 566-575, doi:10.1002/kin.20026,
  Table I, transcribed with the values as printed there (units cm3-mol-sec-kcal-K).
  The 19 reactions R1-R19 are numbered and ordered as in Table I, which is also the
  numbering of Vohra et al., Combust. Flame 204 (2019) 152-161, Table 1.
  Bath-gas choices: R9 uses the N2-bath low-pressure limit (Table I footnote c); the
  He-specific expressions of R5, R6 and R9 are omitted (no He in this file).
  Thermodynamic data (NASA7) are copied from Cantera's h2o2.yaml (Cantera 3.2.0), the
  H2/O2 subset of GRI-Mech 3.0 (Smith et al.); Cantera is BSD-3-Clause licensed (see
  LICENSE-cantera.txt). Built for as-data-sets by Claude (Anthropic), 2026-10-30.

units: {length: cm, time: s, quantity: mol, activation-energy: kcal/mol}

